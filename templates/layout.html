<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSiren</title>
    <script async defer crossorigin="anonymous" 
    src="https://connect.facebook.net/en_US/sdk.js"></script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId      : 'your_facebook_app_id',
                cookie     : true,              
                xfbml      : true,            
                version    : 'v17.0'              
            });
            FB.AppEvents.logPageView();
        };
    </script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .slim-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 70px;
            background: linear-gradient(135deg, #292433, #191b1f);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            
        }

        .slim-sidebar img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .slim-sidebar ul {
            margin-top: 5px;
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .slim-sidebar ul li {
            width: 100%;
            text-align: center;
            padding-top: 80%;
            margin-top: 70%;
        }

        .slim-sidebar ul li a {
            display: block;
            text-decoration: none;
            color: #f1f1f1;
            font-size: 1.2rem;
            padding: 10px;
            transition: background 0.3s;
        }

        .slim-sidebar ul li a:hover {
            background: #03a9f4;
            border-radius: 50%;
            color: #fff;
        }

        .slim-sidebar ul li a i {
            font-size: 1.5rem;
        }

        .main-content {
            margin-left: 80px; 
            padding: 20px;
        }

        @media (max-width: 768px) {
            .slim-sidebar {
                width: 60px;
            }

            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="slim-sidebar">
        <div>
            <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo">
        </div>
        <ul>
            <li><a href="#" title="Dashboard"><i class="bi bi-house-door-fill"></i></a></li>
            <li><a href="#" title="My Vehicle"><i class="bi bi-car-front-fill"></i></a></li>
            <li><a href="#" title="Reports"><i class="bi bi-file-earmark-bar-graph"></i></a></li>
            <li><a href="#" title="Settings"><i class="bi bi-gear-fill"></i></a></li>
        </ul>
        <div>
            <a href="#" title="Logout"><i class="bi bi-box-arrow-right"></i></a>
        </div>
    </div>

    <div class="main-content">
        {% block body %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</body>
</html>
